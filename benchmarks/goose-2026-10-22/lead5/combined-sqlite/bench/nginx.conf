# The Nginx site config in front of every submission on the benchmark box (not yours to change).
# /etc/nginx/nginx.conf also sets worker_rlimit_nofile 65535 and worker_connections 16384.
upstream app {
    server 127.0.0.1:3000;
    keepalive 64;
}

log_format bench '$remote_addr [$time_local] "$request" $status $body_bytes_sent '
                 'rt=$request_time urt=$upstream_response_time';

server {
    listen 80 default_server;
    server_name _;

    access_log /var/log/nginx/bench.access.log bench buffer=64k flush=5s;
    error_log  /var/log/nginx/bench.error.log warn;

    gzip on;
    gzip_types application/json;
    gzip_min_length 1024;

    location / {
        proxy_pass http://app;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }
}
